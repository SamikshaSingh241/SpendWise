apiVersion: v1
kind: ConfigMap
metadata:
  name: spendwise-config
  namespace: spendwise
data:
  PORT: "5000"
  NODE_ENV: "production"
  FRONTEND_URL: "https://spendwise.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: spendwise-secrets
  namespace: spendwise
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongodb-svc:27017/SpendWise"
  JWT_SECRET: "your_secure_jwt_secret_token_change_in_production"
