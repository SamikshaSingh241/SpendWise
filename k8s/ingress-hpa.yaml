apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spendwise-ingress
  namespace: spendwise
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: spendwise.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: spendwise-backend-svc
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spendwise-frontend-svc
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spendwise-backend-hpa
  namespace: spendwise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spendwise-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
